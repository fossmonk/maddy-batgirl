<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Manjari:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>

    <!-- Language Switcher -->
    <div class="lang-switcher">
        <button id="lang-en" class="active">ENGLISH</button>
        <button id="lang-ml">മലയാളം</button>
    </div>

    <!-- Preloader / Envelope Lock Screen -->
    <div class="preloader" id="preloader">
        <div class="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-body">
                <div class="lock-icon" id="unlock-btn">
                    <svg viewBox="0 0 24 24" width="40" height="40" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span data-i18n="openInvite"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container" id="main-content">

        <!-- Hero Section -->
        <section class="hero slide-section">
            <div class="hero-bg"></div>
            <div class="hero-content">
                <div class="hero-motif"></div>
                <h2 data-i18n="subtitle" class="fade-up"></h2>
                <h1 data-i18n="title" class="fade-up delay-1"></h1>
                <p class="hero-date fade-up delay-2" data-i18n="weddingDate"></p>
                <div class="scroll-indicator fade-up delay-3">
                    <span>Scroll</span>
                    <div class="mouse">
                        <div class="wheel"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Our Story Section -->
        <section class="story slide-section">
            <div class="container">
                <h2 class="section-title fade-up" data-i18n="ourStory"></h2>
                <div class="story-content">
                    <div class="story-image-placeholder fade-right">
                        <!-- CSS Background image will be used as placeholder -->
                    </div>
                    <div class="story-text fade-left">
                        <h3 data-i18n="storyTitle"></h3>
                        <p data-i18n="storyText"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Details Section -->
        <section class="details slide-section">
            <div class="container">
                <div class="details-grid">
                    <!-- Wedding -->
                    <div class="event-card fade-up">
                        <div class="event-icon wedding-icon"></div>
                        <h3 data-i18n="weddingDetails"></h3>
                        <p class="event-date" data-i18n="weddingDate"></p>
                        <p class="event-time" data-i18n="weddingTime"></p>
                        <p class="event-venue" data-i18n="weddingVenue"></p>
                    </div>
                    <!-- Reception -->
                    <div class="event-card fade-up delay-1">
                        <div class="event-icon reception-icon"></div>
                        <h3 data-i18n="receptionDetails"></h3>
                        <p class="event-date" data-i18n="receptionDate"></p>
                        <p class="event-time" data-i18n="receptionTime"></p>
                        <p class="event-venue" data-i18n="receptionVenue"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Venue Map Section -->
        <section class="map slide-section">
            <div class="container">
                <h2 class="section-title fade-up" data-i18n="venueMap"></h2>
                <div class="map-container fade-up delay-1">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3920.733593006422!2d76.0380315750414!3d10.59223398954848!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba79549f0322d7d%3A0x6a2185c678a10b4c!2sGuruvayur%20Temple!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin"
                        width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
                <div class="map-actions fade-up delay-2">
                    <a href="https://www.google.com/maps/dir/?api=1&destination=Guruvayur+Temple" target="_blank" class="btn primary-btn map-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                        </svg>
                        <span data-i18n="getDirections"></span>
                    </a>
                </div>
            </div>
        </section>

        <!-- Countdown Section -->
        <section class="countdown slide-section">
            <div class="container">
                <h2 class="section-title fade-up" data-i18n="countdownTitle"></h2>
                <div class="timer fade-up delay-1">
                    <div class="time-block">
                        <span id="days">00</span>
                        <p data-i18n="days"></p>
                    </div>
                    <div class="time-block">
                        <span id="hours">00</span>
                        <p data-i18n="hours"></p>
                    </div>
                    <div class="time-block">
                        <span id="minutes">00</span>
                        <p data-i18n="minutes"></p>
                    </div>
                    <div class="time-block">
                        <span id="seconds">00</span>
                        <p data-i18n="seconds"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- RSVP Section -->
        <section class="rsvp slide-section">
            <div class="container">
                <h2 class="section-title fade-up" data-i18n="rsvp"></h2>
                <p class="contact-text fade-up delay-1" data-i18n="contactText"></p>
                <div class="contact-buttons fade-up delay-2">
                    <a href="tel:+919800000000" class="btn primary-btn"><span data-i18n="contactAnand"></span></a>
                    <a href="tel:+919800000000" class="btn secondary-btn"><span data-i18n="contactAkshaya"></span></a>
                </div>
            </div>
        </section>

    </div>

    <script src="translations.js"></script>
    <script src="script.js"></script>
</body>

</html>
